name: Build Mac ARM64 Runtime

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'scripts/**'
      - '.github/workflows/build-runtime-mac.yml'

jobs:
  build:
    runs-on: macos-14   # Apple Silicon M1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── 1. Standalone Python 3.11 for macOS arm64 ─────────────────────
      - name: Download python-build-standalone
        run: |
          PY_URL="https://github.com/indygreg/python-build-standalone/releases/download/20240107/cpython-3.11.7+20240107-aarch64-apple-darwin-install_only.tar.gz"
          echo "Downloading Python standalone..."
          curl -L "$PY_URL" -o python-standalone.tar.gz
          mkdir -p runtime/python
          tar -xzf python-standalone.tar.gz -C runtime/python --strip-components=1
          runtime/python/bin/python3 --version

      # ── 2. pip install all AI/audio packages ──────────────────────────
      - name: Install Python packages
        run: |
          PYTHON=runtime/python/bin/python3
          $PYTHON -m pip install --upgrade pip --quiet

          echo "Installing torch CPU..."
          $PYTHON -m pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu --quiet

          echo "Installing demucs..."
          $PYTHON -m pip install demucs --quiet

          echo "Installing librosa + audio stack..."
          $PYTHON -m pip install librosa soxr soundfile numpy scipy --quiet

          echo "Installing numba + llvmlite..."
          $PYTHON -m pip install numba llvmlite --quiet

          echo "Done. Verifying..."
          $PYTHON -c "import torch; import demucs; import librosa; import numba; print('All packages OK')"

      # ── 3. ffmpeg static binary for macOS arm64 ───────────────────────
      - name: Download ffmpeg
        run: |
          mkdir -p runtime/bin
          echo "Downloading ffmpeg for macOS arm64..."
          # Use homebrew's ffmpeg bottle (static)
          brew install ffmpeg 2>/dev/null || true
          FFMPEG_PATH=$(which ffmpeg)
          if [ -n "$FFMPEG_PATH" ]; then
            cp "$FFMPEG_PATH" runtime/bin/ffmpeg
            chmod +x runtime/bin/ffmpeg
            echo "ffmpeg from brew: $(runtime/bin/ffmpeg -version 2>&1 | head -1)"
          else
            # Fallback: download static build
            curl -L "https://evermeet.cx/pub/ffmpeg/ffmpeg-7.0.zip" -o ffmpeg.zip
            unzip -o ffmpeg.zip ffmpeg -d runtime/bin/ || unzip -o ffmpeg.zip -d /tmp/ffmpeg_extract && cp /tmp/ffmpeg_extract/ffmpeg runtime/bin/ffmpeg
            chmod +x runtime/bin/ffmpeg
          fi

      # ── 4. yt-dlp for macOS ───────────────────────────────────────────
      - name: Download yt-dlp
        run: |
          curl -L "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp_macos" \
            -o runtime/bin/yt-dlp
          chmod +x runtime/bin/yt-dlp
          runtime/bin/yt-dlp --version

      # ── 5. Copy Python scripts ────────────────────────────────────────
      - name: Add Python scripts
        run: |
          mkdir -p runtime/python-scripts
          cp scripts/analyze.py       runtime/python-scripts/
          cp scripts/demucs_runner.py runtime/python-scripts/
          cp scripts/loop_finder.py   runtime/python-scripts/
          echo "Scripts copied:"
          ls -la runtime/python-scripts/

      # ── 6. Package into zip ───────────────────────────────────────────
      - name: Package runtime
        run: |
          mkdir -p dist
          chmod +x runtime/bin/ffmpeg runtime/bin/yt-dlp runtime/python/bin/python3

          # Wrap in expected structure: runtime/darwin-arm64/...
          mkdir -p package/runtime/darwin-arm64
          cp -R runtime/python         package/runtime/darwin-arm64/
          cp -R runtime/bin            package/runtime/darwin-arm64/
          cp -R runtime/python-scripts package/runtime/darwin-arm64/
          mkdir -p package/runtime/darwin-arm64/models

          echo "Packaging..."
          cd package
          zip -r9 ../dist/wavemakrz-runtime-mac-arm64.zip runtime
          cd ..

          echo "Size: $(du -sh dist/wavemakrz-runtime-mac-arm64.zip | cut -f1)"

          # Checksums
          cd dist
          shasum -a 256 wavemakrz-runtime-mac-arm64.zip > checksums.txt
          cat checksums.txt

      # ── 7. Upload as artifact (always available) ──────────────────────
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wavemakrz-runtime-mac-arm64
          path: dist/
          retention-days: 30

      # ── 8. Create/update GitHub Release v1 ───────────────────────────
      - name: Publish to GitHub Release v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing v1 release if any
          gh release delete v1 --yes 2>/dev/null || true
          git tag -d v1 2>/dev/null || true
          git push origin :refs/tags/v1 2>/dev/null || true

          # Create fresh release
          gh release create v1 \
            dist/wavemakrz-runtime-mac-arm64.zip \
            dist/checksums.txt \
            --title "WAVEMAKRZ Runtime v1" \
            --notes "Bundled Python 3.11 runtime for macOS ARM64 (Apple Silicon). Downloaded automatically on first launch." \
            --repo 707wlrd/wavemakrz-runtime
